<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pallanguzhi - பல்லாங்குழி</title>
<style>
  :root {
    --board-wood: #3a1d0d;
    --board-rim: #1f0d04;
    --gold: #d4af37;
    --shell-bg: #f9f5eb;
    --shell-shade: #c2ab87;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #1b0e06, #070301);
    color: #e6c8a5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    box-sizing: border-box;
  }

  h1 {
    margin: 4px 0;
    color: var(--gold);
    letter-spacing: 2px;
    font-size: 1.8rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .subtitle {
    font-size: 0.9rem;
    color: #a88460;
    margin-bottom: 16px;
  }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 640px;
    margin-bottom: 16px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid #5a3116;
    border-radius: 12px;
    padding: 10px 18px;
    box-sizing: border-box;
  }

  .player-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
  }

  .player-box.active {
    color: #58d68d;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(88, 214, 141, 0.4);
  }

  .score-badge {
    background: #110702;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: bold;
  }

  /* Wood Board */
  .board {
    background: radial-gradient(circle at center, #532912 0%, #301709 80%, var(--board-rim) 100%);
    border: 8px solid var(--board-rim);
    box-shadow: 0 16px 36px rgba(0,0,0,0.9), inset 0 2px 4px rgba(255,255,255,0.1);
    border-radius: 36px;
    padding: 20px 16px;
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 680px;
    box-sizing: border-box;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }

  /* Carved Wooden Cups */
  .pit {
    aspect-ratio: 1;
    background: radial-gradient(circle at 70% 70%, #0d0602 10%, #1c0c05 60%, #381909 100%);
    border-radius: 50%;
    box-shadow: inset 0 6px 12px rgba(0,0,0,0.95), 0 2px 4px rgba(255,255,255,0.06);
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
  }

  .pit.playable:hover {
    border-color: var(--gold);
    transform: scale(1.06);
  }

  .pit.highlight {
    border-color: #58d68d;
    box-shadow: 0 0 12px #58d68d, inset 0 6px 12px #000;
  }

  .count-label {
    position: absolute;
    bottom: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gold);
  }

  /* Realistic Shell Sprites */
  .cluster {
    position: relative;
    width: 60%;
    height: 60%;
  }

  .shell {
    position: absolute;
    width: 12px;
    height: 8px;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--shell-bg) 55%, var(--shell-shade) 100%);
    border-radius: 50% 50% 45% 45%;
    box-shadow: 1px 2px 3px rgba(0,0,0,0.7);
    border-bottom: 1px solid #7c6246;
  }

  /* Floating Moving Shell for Animation */
  #flying-shell {
    position: fixed;
    width: 16px;
    height: 10px;
    background: radial-gradient(circle at 30% 30%, #fff, #ebdcc3);
    border-radius: 50%;
    box-shadow: 0 8px 12px rgba(0,0,0,0.6);
    pointer-events: none;
    display: none;
    z-index: 1000;
    transition: all 0.18s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  /* Log message */
  .status-message {
    margin-top: 16px;
    font-size: 0.95rem;
    min-height: 24px;
    text-align: center;
    color: #ecd5b8;
  }

  .actions {
    margin-top: 14px;
    display: flex;
    gap: 12px;
  }

  button {
    background: linear-gradient(180deg, #5c2f13, #361706);
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 8px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover {
    background: linear-gradient(180deg, #743d19, #482009);
  }
</style>
</head>
<body>

  <h1>பல்லாங்குழி</h1>
  <div class="subtitle">Pallanguzhi Traditional Board</div>

  <div class="scoreboard">
    <div class="player-box" id="p2-box">
      <span>Player 2 (Top)</span>
      <span class="score-badge" id="p2-score">0</span>
    </div>
    <div class="player-box active" id="p1-box">
      <span>Player 1 (Bottom)</span>
      <span class="score-badge" id="p1-score">0</span>
    </div>
  </div>

  <div class="board">
    <div class="row" id="row-top"></div>
    <div class="row" id="row-bottom"></div>
  </div>

  <div id="flying-shell"></div>

  <div class="status-message" id="message">Player 1: Pick a pit on your side to sow.</div>

  <div class="actions">
    <button onclick="startGame(false)">2-Player (Pass & Play)</button>
    <button onclick="startGame(true)">Play vs AI</button>
  </div>

<script>
  const TOTAL_PITS = 14;
  const SEEDS_PER_PIT = 5;
  let pits = new Array(TOTAL_PITS).fill(SEEDS_PER_PIT);
  let turn = 1; // 1: Player 1 (Bottom, pits 0-6), 2: Player 2 (Top, pits 7-13)
  let scores = { 1: 0, 2: 0 };
  let vsAi = false;
  let isMoving = false;

  // Synthesized Wood / Shell Clatter Sound using Browser Web Audio
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audio = new AudioCtx();

  function playDropSound() {
    if (audio.state === 'suspended') audio.resume();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'triangle';
    // Randomize pitch slightly so every shell drop sounds unique
    osc.frequency.setValueAtTime(650 + Math.random() * 250, audio.currentTime);
    gain.gain.setValueAtTime(0.2, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.06);
  }

  function playCaptureSound() {
    if (audio.state === 'suspended') audio.resume();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audio.currentTime + 0.18);
    gain.gain.setValueAtTime(0.3, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.2);
  }

  function initDOM() {
    const topRow = document.getElementById('row-top');
    const btmRow = document.getElementById('row-bottom');
    topRow.innerHTML = '';
    btmRow.innerHTML = '';

    // Top row: pits 13 down to 7 (clockwise circuit)
    for (let i = 13; i >= 7; i--) {
      topRow.appendChild(createPit(i));
    }
    // Bottom row: pits 0 up to 6
    for (let i = 0; i <= 6; i++) {
      btmRow.appendChild(createPit(i));
    }
    render();
  }

  function createPit(idx) {
    const el = document.createElement('div');
    el.className = 'pit';
    el.id = `pit-${idx}`;
    el.onclick = () => onPitClick(idx);
    return el;
  }

  function render() {
    for (let i = 0; i < TOTAL_PITS; i++) {
      const pitEl = document.getElementById(`pit-${i}`);
      pitEl.innerHTML = '';

      const count = pits[i];
      const countLabel = document.createElement('span');
      countLabel.className = 'count-label';
      countLabel.innerText = count;
      pitEl.appendChild(countLabel);

      const cluster = document.createElement('div');
      cluster.className = 'cluster';
      const visible = Math.min(count, 12);
      for (let s = 0; s < visible; s++) {
        const shell = document.createElement('div');
        shell.className = 'shell';
        const angle = (s / visible) * Math.PI * 2;
        const dist = Math.min(14, visible * 1.5);
        shell.style.left = `${50 + Math.cos(angle) * dist - 6}%`;
        shell.style.top = `${50 + Math.sin(angle) * dist - 4}%`;
        shell.style.transform = `rotate(${s * 53}deg)`;
        cluster.appendChild(shell);
      }
      pitEl.appendChild(cluster);

      // Playable highlights
      pitEl.classList.remove('playable');
      if (!isMoving) {
        if (turn === 1 && i >= 0 && i <= 6 && count > 0) pitEl.classList.add('playable');
        if (turn === 2 && !vsAi && i >= 7 && i <= 13 && count > 0) pitEl.classList.add('playable');
      }
    }

    document.getElementById('p1-score').innerText = scores[1];
    document.getElementById('p2-score').innerText = scores[2];
    document.getElementById('p1-box').classList.toggle('active', turn === 1);
    document.getElementById('p2-box').classList.toggle('active', turn === 2);
  }

  async function onPitClick(index) {
    if (isMoving) return;
    if (turn === 1 && (index < 0 || index > 6)) return;
    if (turn === 2 && (index < 7 || index > 13)) return;
    if (pits[index] === 0) return;

    await executeSowing(index);
  }

  async function executeSowing(startIdx) {
    isMoving = true;
    let hand = pits[startIdx];
    pits[startIdx] = 0;
    render();
    playDropSound();

    let curr = startIdx;

    while (true) {
      // Sow hand one-by-one counter-clockwise
      while (hand > 0) {
        curr = (curr + 1) % TOTAL_PITS;
        pits[curr]++;
        hand--;

        playDropSound();
        flashPit(curr);
        render();
        await wait(180);

        // Pasu Rule: Exactly 4 seeds accumulated in any pit during sowing
        if (pits[curr] === 4) {
          const owner = curr <= 6 ? 1 : 2;
          scores[owner] += 4;
          pits[curr] = 0;
          playCaptureSound();
          document.getElementById('message').innerText = `Pasu! 4 seeds captured by Player ${owner}!`;
          render();
          await wait(220);
        }
      }

      // Check next pit
      const next = (curr + 1) % TOTAL_PITS;
      if (pits[next] > 0) {
        // Continuous sowing
        hand = pits[next];
        pits[next] = 0;
        curr = next;
        playDropSound();
        render();
        await wait(200);
      } else {
        // Next pit is empty -> Capture from the pit immediately following!
        const captureIdx = (next + 1) % TOTAL_PITS;
        if (pits[captureIdx] > 0) {
          const won = pits[captureIdx];
          scores[turn] += won;
          pits[captureIdx] = 0;
          playCaptureSound();
          document.getElementById('message').innerText = `Player ${turn} captured ${won} seeds!`;
        } else {
          document.getElementById('message').innerText = `Empty pit. Turn ended.`;
        }
        render();
        break;
      }
    }

    turn = turn === 1 ? 2 : 1;
    isMoving = false;
    render();

    if (checkEnd()) return;

    if (turn === 2 && vsAi) {
      document.getElementById('message').innerText = "AI thinking...";
      await wait(600);
      runAi();
    }
  }

  function runAi() {
    const valid = [];
    for (let i = 7; i <= 13; i++) {
      if (pits[i] > 0) valid.push(i);
    }
    if (!valid.length) return;
    // Pick pit with the most seeds
    valid.sort((a, b) => pits[b] - pits[a]);
    executeSowing(valid[0]);
  }

  function checkEnd() {
    const p1Empty = pits.slice(0, 7).every(v => v === 0);
    const p2Empty = pits.slice(7, 14).every(v => v === 0);

    if (p1Empty || p2Empty) {
      for (let i = 0; i < 7; i++) { scores[1] += pits[i]; pits[i] = 0; }
      for (let i = 7; i < 14; i++) { scores[2] += pits[i]; pits[i] = 0; }
      render();

      let res = "Draw!";
      if (scores[1] > scores[2]) res = "Player 1 Wins!";
      else if (scores[2] > scores[1]) res = "Player 2 Wins!";

      document.getElementById('message').innerText = `Game Over! ${res}`;
      return true;
    }
    return false;
  }

  function flashPit(idx) {
    const el = document.getElementById(`pit-${idx}`);
    if (el) {
      el.classList.add('highlight');
      setTimeout(() => el.classList.remove('highlight'), 180);
    }
  }

  function startGame(aiMode) {
    pits = new Array(TOTAL_PITS).fill(SEEDS_PER_PIT);
    scores = { 1: 0, 2: 0 };
    turn = 1;
    vsAi = aiMode;
    isMoving = false;
    document.getElementById('message').innerText = `Game started (${aiMode ? 'vs AI' : '2-Player'}). Player 1 turn.`;
    render();
  }

  function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  initDOM();
</script>
</body>
</html>
