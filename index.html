<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pallanguzhi - பல்லாங்குழி</title>
<style>
  :root {
    --wood-rim: #140702;
    --wood-outer: #2c1206;
    --wood-mid: #4a210d;
    --wood-highlight: #703716;
    --gold: #d4af37;
    --seed-dark: #241108;
    --seed-mid: #431f0e;
    --seed-light: #6a3418;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #1c0c05 0%, #070301 100%);
    color: #ebd3be;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 12px;
  }

  /* Header & Score bar (Compact Landscape Strip) */
  .top-bar {
    width: 95vw;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 6px 16px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid #542710;
    border-radius: 12px;
  }

  .title-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  h1 {
    margin: 0;
    color: var(--gold);
    font-size: 1.5rem;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .subtitle {
    font-size: 0.85rem;
    color: #b1875c;
  }

  .score-card {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }

  .score-card.active {
    border-color: #58d68d;
    background: rgba(88, 214, 141, 0.12);
    color: #72f0a7;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(88, 214, 141, 0.25);
  }

  .score-val {
    background: #0f0602;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: bold;
  }

  /* Wide Antique Wooden Board */
  .board-wrapper {
    width: 96vw;
    max-width: 1120px;
    height: 60vh;
    min-height: 280px;
    background: radial-gradient(ellipse at center, var(--wood-highlight) 0%, var(--wood-mid) 50%, var(--wood-outer) 80%, var(--wood-rim) 100%);
    border: 12px solid var(--wood-rim);
    box-shadow: 0 20px 45px rgba(0,0,0,0.9), inset 0 2px 6px rgba(255,255,255,0.15);
    border-radius: 44px;
    padding: 16px 24px;
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    gap: 16px;
    position: relative;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 14px;
  }

  /* Deep Carved Wooden Cups */
  .pit {
    height: 100%;
    background: radial-gradient(circle at 75% 75%, #050201 0%, #150904 55%, #2a1106 100%);
    border-radius: 50%;
    box-shadow: inset 0 10px 18px rgba(0,0,0,0.95), 0 2px 5px rgba(255,255,255,0.08);
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.2s;
  }

  .pit.playable:hover {
    border-color: var(--gold);
    transform: scale(1.04);
  }

  .pit.highlight {
    border-color: #58d68d;
    box-shadow: 0 0 16px #58d68d, inset 0 10px 18px #000;
  }

  .count-indicator {
    position: absolute;
    bottom: 6px;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 1px 4px #000;
  }

  /* Tamarind Seeds (புளியங்கொட்டை) - Asymmetric, Rough & Two-Toned */
  .seeds-cluster {
    position: relative;
    width: 68%;
    height: 68%;
  }

  .tamarind-seed {
    position: absolute;
    width: 15px;
    height: 12px;
    background: radial-gradient(ellipse at 40% 30%, #5d2810 0%, var(--seed-mid) 45%, var(--seed-dark) 90%);
    border-radius: 40% 60% 50% 50% / 50% 45% 55% 50%;
    box-shadow: 1px 3px 4px rgba(0,0,0,0.85);
    border: 1px solid #1a0802;
  }

  /* One side slightly rougher / flat */
  .tamarind-seed::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 6px;
    height: 5px;
    background: rgba(184, 115, 77, 0.25);
    border-radius: 40%;
    filter: blur(0.5px);
  }

  /* Bottom status strip & controls */
  .bottom-bar {
    width: 95vw;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding: 6px 14px;
  }

  .status-message {
    font-size: 0.95rem;
    color: #ebd3be;
    font-weight: 500;
  }

  .btn-group {
    display: flex;
    gap: 10px;
  }

  button {
    background: linear-gradient(180deg, #592911, #311507);
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 7px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  button:hover {
    background: linear-gradient(180deg, #743717, #451d09);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="title-group">
      <h1>பல்லாங்குழி</h1>
      <span class="subtitle">Traditional Tamarind Seed Game</span>
    </div>
    <div class="score-card" id="p2-card">
      <span>Player 2 (Top)</span>
      <span class="score-val" id="p2-score">0</span>
    </div>
    <div class="score-card active" id="p1-card">
      <span>Player 1 (Bottom)</span>
      <span class="score-val" id="p1-score">0</span>
    </div>
  </div>

  <div class="board-wrapper">
    <!-- Top Row: Pits 13 down to 7 (Left to Right) -->
    <div class="row" id="top-row"></div>
    <!-- Bottom Row: Pits 0 up to 6 (Left to Right) -->
    <div class="row" id="bottom-row"></div>
  </div>

  <div class="bottom-bar">
    <div class="status-message" id="status-msg">Player 1: Tap a pit on your side to sow.</div>
    <div class="btn-group">
      <button onclick="resetMatch(false)">Pass & Play</button>
      <button onclick="resetMatch(true)">Play vs AI</button>
    </div>
  </div>

<script>
  const PIT_TOTAL = 14;
  const SEED_COUNT = 5;
  let pits = new Array(PIT_TOTAL).fill(SEED_COUNT);
  let activeTurn = 1; // 1: Bottom (0-6), 2: Top (7-13)
  let playerScores = { 1: 0, 2: 0 };
  let isAiMode = false;
  let isTurnRunning = false;

  // Realistic Organic Wooden "Thock" Audio (Natural Seed Drop)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioContext = new AudioCtx();

  function playOrganicSeedDrop() {
    if (audioContext.state === 'suspended') audioContext.resume();
    const t = audioContext.currentTime;

    // Layer 1: Low body resonance (wooden hollow pitch)
    const bodyOsc = audioContext.createOscillator();
    const bodyGain = audioContext.createGain();
    bodyOsc.type = 'sine';
    const pitchJitter = 160 + (Math.random() * 40 - 20);
    bodyOsc.frequency.setValueAtTime(pitchJitter, t);
    bodyOsc.frequency.exponentialRampToValueAtTime(80, t + 0.12);

    bodyGain.gain.setValueAtTime(0.35, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    bodyOsc.connect(bodyGain);
    bodyGain.connect(audioContext.destination);

    bodyOsc.start(t);
    bodyOsc.stop(t + 0.12);

    // Layer 2: High friction click (seed landing on hard wood)
    const clickOsc = audioContext.createOscillator();
    const clickGain = audioContext.createGain();
    clickOsc.type = 'triangle';
    clickOsc.frequency.setValueAtTime(850 + Math.random() * 300, t);
    clickGain.gain.setValueAtTime(0.18, t);
    clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    clickOsc.connect(clickGain);
    clickGain.connect(audioContext.destination);

    clickOsc.start(t);
    clickOsc.stop(t + 0.04);
  }

  function playCaptureSound() {
    if (audioContext.state === 'suspended') audioContext.resume();
    const t = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(640, t + 0.3);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(t);
    osc.stop(t + 0.35);
  }

  function initBoard() {
    const topRow = document.getElementById('top-row');
    const bottomRow = document.getElementById('bottom-row');
    topRow.innerHTML = '';
    bottomRow.innerHTML = '';

    for (let i = 13; i >= 7; i--) {
      topRow.appendChild(createPitElement(i));
    }
    for (let i = 0; i <= 6; i++) {
      bottomRow.appendChild(createPitElement(i));
    }
    refreshBoardView();
  }

  function createPitElement(idx) {
    const el = document.createElement('div');
    el.className = 'pit';
    el.id = `pit-${idx}`;
    el.onclick = () => onPitSelect(idx);
    return el;
  }

  function refreshBoardView() {
    for (let i = 0; i < PIT_TOTAL; i++) {
      const pitEl = document.getElementById(`pit-${i}`);
      pitEl.innerHTML = '';

      const seedNum = pits[i];

      // Number badge
      const badge = document.createElement('span');
      badge.className = 'count-indicator';
      badge.innerText = seedNum;
      pitEl.appendChild(badge);

      // Tamarind Seed Sprites Cluster
      const cluster = document.createElement('div');
      cluster.className = 'seeds-cluster';

      const visibleSeeds = Math.min(seedNum, 14);
      for (let s = 0; s < visibleSeeds; s++) {
        const seed = document.createElement('div');
        seed.className = 'tamarind-seed';
        
        // Random organic jitter in cups
        const angle = (s / visibleSeeds) * Math.PI * 2;
        const radius = Math.min(18, visibleSeeds * 1.8);
        const offsetX = Math.cos(angle) * radius;
        const offsetY = Math.sin(angle) * radius;
        const rot = (s * 47 + i * 13) % 360;

        seed.style.left = `calc(50% + ${offsetX}px - 7px)`;
        seed.style.top = `calc(50% + ${offsetY}px - 6px)`;
        seed.style.transform = `rotate(${rot}deg)`;
        cluster.appendChild(seed);
      }
      pitEl.appendChild(cluster);

      // Playable selection borders
      pitEl.classList.remove('playable');
      if (!isTurnRunning) {
        if (activeTurn === 1 && i >= 0 && i <= 6 && seedNum > 0) {
          pitEl.classList.add('playable');
        } else if (activeTurn === 2 && !isAiMode && i >= 7 && i <= 13 && seedNum > 0) {
          pitEl.classList.add('playable');
        }
      }
    }

    document.getElementById('p1-score').innerText = playerScores[1];
    document.getElementById('p2-score').innerText = playerScores[2];
    document.getElementById('p1-card').classList.toggle('active', activeTurn === 1);
    document.getElementById('p2-card').classList.toggle('active', activeTurn === 2);
  }

  async function onPitSelect(pitIdx) {
    if (isTurnRunning) return;
    if (activeTurn === 1 && (pitIdx < 0 || pitIdx > 6)) return;
    if (activeTurn === 2 && (pitIdx < 7 || pitIdx > 13)) return;
    if (pits[pitIdx] === 0) return;

    await executeSowingMotion(pitIdx);
  }

  async function executeSowingMotion(startIdx) {
    isTurnRunning = true;
    let hand = pits[startIdx];
    pits[startIdx] = 0;
    refreshBoardView();
    playOrganicSeedDrop();

    let curr = startIdx;

    while (true) {
      // Sow counter-clockwise (slower, deliberate timing)
      while (hand > 0) {
        curr = (curr + 1) % PIT_TOTAL;
        pits[curr]++;
        hand--;

        playOrganicSeedDrop();
        highlightPitEffect(curr);
        refreshBoardView();
        
        // Slower movement delay: 320ms per drop
        await delay(320);

        // Pasu Rule (4 seeds accumulated)
        if (pits[curr] === 4) {
          const owner = curr <= 6 ? 1 : 2;
          playerScores[owner] += 4;
          pits[curr] = 0;
          playCaptureSound();
          document.getElementById('status-msg').innerText = `Pasu! 4 seeds captured by Player ${owner}!`;
          refreshBoardView();
          await delay(450);
        }
      }

      // Check following pit
      const nextIdx = (curr + 1) % PIT_TOTAL;
      if (pits[nextIdx] > 0) {
        // Continue sowing
        hand = pits[nextIdx];
        pits[nextIdx] = 0;
        curr = nextIdx;
        playOrganicSeedDrop();
        refreshBoardView();
        await delay(380);
      } else {
        // Next pit is empty -> Capture from adjacent cup!
        const captureIdx = (nextIdx + 1) % PIT_TOTAL;
        if (pits[captureIdx] > 0) {
          const won = pits[captureIdx];
          playerScores[activeTurn] += won;
          pits[captureIdx] = 0;
          playCaptureSound();
          document.getElementById('status-msg').innerText = `Player ${activeTurn} captured ${won} seeds!`;
        } else {
          document.getElementById('status-msg').innerText = `Turn ended. Empty cup.`;
        }
        refreshBoardView();
        break;
      }
    }

    activeTurn = activeTurn === 1 ? 2 : 1;
    isTurnRunning = false;
    refreshBoardView();

    if (verifyGameOver()) return;

    if (activeTurn === 2 && isAiMode) {
      document.getElementById('status-msg').innerText = "AI thinking...";
      await delay(800);
      runAiDecision();
    }
  }

  function runAiDecision() {
    const validPits = [];
    for (let i = 7; i <= 13; i++) {
      if (pits[i] > 0) validPits.push(i);
    }
    if (!validPits.length) return;
    validPits.sort((a, b) => pits[b] - pits[a]);
    executeSowingMotion(validPits[0]);
  }

  function verifyGameOver() {
    const p1Empty = pits.slice(0, 7).every(v => v === 0);
    const p2Empty = pits.slice(7, 14).every(v => v === 0);

    if (p1Empty || p2Empty) {
      for (let i = 0; i < 7; i++) { playerScores[1] += pits[i]; pits[i] = 0; }
      for (let i = 7; i < 14; i++) { playerScores[2] += pits[i]; pits[i] = 0; }
      refreshBoardView();

      let victor = "Game Tied!";
      if (playerScores[1] > playerScores[2]) victor = "Player 1 Wins!";
      else if (playerScores[2] > playerScores[1]) victor = "Player 2 Wins!";

      document.getElementById('status-msg').innerText = `Game Over! ${victor}`;
      return true;
    }
    return false;
  }

  function highlightPitEffect(idx) {
    const el = document.getElementById(`pit-${idx}`);
    if (el) {
      el.classList.add('highlight');
      setTimeout(() => el.classList.remove('highlight'), 280);
    }
  }

  function resetMatch(ai) {
    pits = new Array(PIT_TOTAL).fill(SEED_COUNT);
    playerScores = { 1: 0, 2: 0 };
    activeTurn = 1;
    isAiMode = ai;
    isTurnRunning = false;
    document.getElementById('status-msg').innerText = `New Game (${ai ? 'vs AI' : 'Pass & Play'}). Player 1 turn.`;
    refreshBoardView();
  }

  function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  initBoard();
</script>
</body>
</html>
